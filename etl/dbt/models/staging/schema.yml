# THE CANONICAL DATA MODEL — one entity per route.
#
# This file DRIVES the normalization (it is not just documentation):
#   - stg_* model SQL is GENERATED from these columns by the
#     build_staging macro: data_type -> cast, meta.expr -> cleanup
#   - the ingest landing gate (require_columns) is DERIVED from these
#     column names by resolve_transform_spec
#   - the data_tests are enforced on every dbt build; a violation fails
#     the transform child workflow, which quarantines the file
# Upstream, the route spec's column_aliases map vendor name variants onto
# these canonical names. Adding a field = one block here (+ an alias if
# vendors name it differently).
version: 2

models:
  - name: stg_orders
    description: >
      Canonical order: one row per order line as delivered by a vendor.
      Grain: order_id.
    columns:
      - name: order_id
        description: Vendor order identifier.
        data_type: int
        data_tests: [not_null, unique]
      - name: customer
        description: Customer key; joins dim_customers.customer.
        data_type: string
        data_tests: [not_null]
      - name: order_date
        description: Order date.
        data_type: date
        data_tests: [not_null]
      - name: amount
        description: Order amount (vendor currency).
        data_type: double
        data_tests: [not_null]
      - name: status
        description: Lifecycle status, lowercased/trimmed.
        data_type: string
        meta: { expr: "lower(trim(status))" }
        data_tests:
          - not_null
          - accepted_values:
              values: ["completed", "cancelled", "pending"]

  - name: stg_customers
    description: >
      Canonical customer: one row per customer. Grain: customer.
    columns:
      - name: customer
        data_type: string
        data_tests: [not_null, unique]
      - name: segment
        description: Commercial segment, lowercased.
        data_type: string
        meta: { expr: "lower(trim(segment))" }
        data_tests: [not_null]
      - name: region
        description: Operating region, lowercased.
        data_type: string
        meta: { expr: "lower(trim(region))" }
        data_tests: [not_null]

  - name: stg_payments
    description: >
      Canonical payment: one row per payment event. Grain: payment_id.
    columns:
      - name: payment_id
        data_type: int
        data_tests: [not_null, unique]
      - name: order_id
        description: Order the payment settles; joins stg_orders.order_id.
        data_type: int
        data_tests: [not_null]
      - name: paid_amount
        data_type: double
        data_tests: [not_null]
      - name: paid_date
        data_type: date
        data_tests: [not_null]

  - name: stg_settlements
    description: >
      Canonical settlement: one row per order outcome in a remittance
      batch, as written by the order-settlement tenant's outbound leg.
      Grain: order_ref within a batch.
    columns:
      - name: batch_id
        description: The batch workflow id — joins back to workflow lineage.
        data_type: string
        data_tests: [not_null]
      - name: order_ref
        description: Vendor order reference.
        data_type: string
        data_tests: [not_null, unique]
      - name: vendor
        description: Vendor identifier, lowercased.
        data_type: string
        data_tests: [not_null]
      - name: item_count
        description: Units on the order (0 when denied at validation).
        data_type: int
      - name: submitted_amount
        description: What the vendor asked for.
        data_type: double
        data_tests: [not_null]
      - name: priced_amount
        description: Contract-priced amount (0.0 when never priced).
        data_type: double
        data_tests: [not_null]
      - name: variance_pct
        description: Submitted vs priced, percent.
        data_type: double
      - name: outcome
        description: Terminal lifecycle outcome.
        data_type: string
        meta: { expr: "lower(trim(outcome))" }
        data_tests:
          - not_null
          - accepted_values:
              values: ["settled", "denied", "escalated"]
      - name: decision_source
        description: What decided it.
        data_type: string
        data_tests:
          - accepted_values:
              values: ["auto", "reviewer", "validation", "sla_timeout"]
      - name: payable_amount
        description: What actually gets paid.
        data_type: double
        data_tests: [not_null]
      - name: note
        description: Reviewer note or denial reason.
        data_type: string
