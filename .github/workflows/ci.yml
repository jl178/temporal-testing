name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  infra:
    name: CDK typecheck, assertion tests, synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx tsc
      - run: npx jest
      - name: cdk synth (create-everything mode)
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-east-1

  python-unit:
    name: worker platform + spec resolution unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements-dev.txt
      - run: python -m pytest etl/tests -q

  images:
    name: Build worker images (reference — not pushed anywhere)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One image per codebase; every fleet runs its codebase's image with a
      # different worker_platform command (queue + profile + registrations).
      - name: ETL team worker image
        run: docker build -f etl/Dockerfile -t temporal-testing/etl-worker:${{ github.sha }} .
      - name: Billing tenant worker image
        run: docker build -f examples/platform-demo/Dockerfile -t temporal-testing/billing-worker:${{ github.sha }} .
      - name: Build order-settlement worker image
        run: docker build -f examples/order-settlement/Dockerfile -t temporal-testing/settlement-worker:${{ github.sha }} .
      - name: Greeting app-worker image (prod compose stack's worker)
        run: docker build -f examples/python/Dockerfile -t temporal-testing/greeting-worker:${{ github.sha }} examples/python

      # ---------------------------------------------------------------
