name: aws-deploy-validate

# Real-AWS validation cycle: deploy NET-NEW Temporal infra, validate it
# serves, then tear down ONLY what this run created. Manual dispatch only.
#
# Net-new guarantees:
#   - stack names carry the -ci suffix (never collide with existing stacks;
#     preflight aborts if they somehow exist)
#   - a dedicated CDK bootstrap qualifier + toolkit stack name, so any
#     pre-existing CDKToolkit in the account is never read or modified
#   - create-everything mode: no -c imports, so no lookups of existing infra
# Teardown runs even on failure so no billable resources are orphaned —
# unless mode=deploy-keep, which leaves the stack running for inspection
# (tear it down later with mode=teardown-only).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full-cycle = deploy+validate+teardown; deploy-keep = leave it running; teardown-only = remove a kept stack'
        type: choice
        default: full-cycle
        options: [full-cycle, deploy-keep, teardown-only]

concurrency:
  group: aws-deploy-validate
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  QUALIFIER: tmprl01
  TOOLKIT_STACK: CDKToolkit-temporal-testing
  SUFFIX: ci
  E2E_REPO: temporal-testing-e2e

jobs:
  deploy-validate-teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci

      - name: Resolve account
        run: |
          aws sts get-caller-identity
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Preflight — net-new guarantee
        if: inputs.mode != 'teardown-only'
        run: |
          for s in "TemporalNetworkStack-$SUFFIX" "TemporalStack-$SUFFIX" "$TOOLKIT_STACK"; do
            if aws cloudformation describe-stacks --stack-name "$s" >/dev/null 2>&1; then
              echo "ABORT: stack $s already exists — refusing to touch it." >&2
              exit 1
            fi
          done
          if aws ecr describe-repositories --repository-names "$E2E_REPO" >/dev/null 2>&1; then
            echo "ABORT: ECR repo $E2E_REPO already exists — refusing to touch it." >&2
            exit 1
          fi
          echo "preflight OK: all target stacks + the e2e repo are net-new"

      - name: Grant run-scoped CloudFormation policy (removed in teardown)
        run: |
          cat > /tmp/cfn-policy.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "TemporalTestingEphemeralStacks",
                "Effect": "Allow",
                "Action": ["cloudformation:*"],
                "Resource": [
                  "arn:aws:cloudformation:us-east-1:$ACCOUNT:stack/TemporalNetworkStack-$SUFFIX/*",
                  "arn:aws:cloudformation:us-east-1:$ACCOUNT:stack/TemporalStack-$SUFFIX/*",
                  "arn:aws:cloudformation:us-east-1:$ACCOUNT:stack/$TOOLKIT_STACK/*"
                ]
              },
              {
                "Sid": "NonStackScopedReadOnly",
                "Effect": "Allow",
                "Action": ["cloudformation:ValidateTemplate", "cloudformation:DescribeStacks"],
                "Resource": "*"
              }
            ]
          }
          EOF
          # MANAGED policy (attach/detach), not inline: IAM's 2048-byte cap
          # is the AGGREGATE of a user's inline policies, so two parallel
          # run-grants collide; managed policies don't count against it.
          ARN="arn:aws:iam::$ACCOUNT:policy/temporal-testing-ephemeral-cfn"
          aws iam detach-user-policy --user-name cicd_user --policy-arn "$ARN" 2>/dev/null || true
          aws iam delete-policy --policy-arn "$ARN" 2>/dev/null || true
          aws iam create-policy --policy-name temporal-testing-ephemeral-cfn \
            --policy-document file:///tmp/cfn-policy.json >/dev/null
          aws iam attach-user-policy --user-name cicd_user --policy-arn "$ARN"
          sleep 30  # IAM propagation is eventually consistent

      - name: Bootstrap (isolated qualifier + toolkit)
        if: inputs.mode != 'teardown-only'
        run: |
          # Retry: IAM grants propagate eventually; early CFN calls can 403.
          for attempt in 1 2 3; do
            if npx cdk bootstrap "aws://$ACCOUNT/us-east-1" \
                 --qualifier "$QUALIFIER" \
                 --toolkit-stack-name "$TOOLKIT_STACK"; then
              exit 0
            fi
            echo "bootstrap attempt $attempt failed; cleaning partial stack and retrying"
            aws cloudformation delete-stack --stack-name "$TOOLKIT_STACK" || true
            aws cloudformation wait stack-delete-complete --stack-name "$TOOLKIT_STACK" || true
            sleep 30
          done
          exit 1

      - name: Build and push the e2e worker image (ephemeral ECR repo)
        if: inputs.mode != 'teardown-only'
        run: |
          aws ecr create-repository --repository-name "$E2E_REPO" >/dev/null
          aws ecr get-login-password | docker login --username AWS --password-stdin \
            "$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com"
          docker build -t "$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/$E2E_REPO:$GITHUB_SHA" \
            ../examples/python
          docker push "$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/$E2E_REPO:$GITHUB_SHA"

      - name: Deploy (create-everything, suffixed, with e2e worker fleet)
        if: inputs.mode != 'teardown-only'
        run: |
          npx cdk deploy --all --require-approval never \
            -c stackSuffix="$SUFFIX" \
            -c workerRepo="$E2E_REPO" -c workerTag="$GITHUB_SHA" \
            -c "@aws-cdk/core:bootstrapQualifier=$QUALIFIER" \
            --toolkit-stack-name "$TOOLKIT_STACK" \
            --outputs-file /tmp/outputs.json
          cat /tmp/outputs.json

      - name: Validate — UI serves through ALB -> frontend -> Aurora
        if: inputs.mode != 'teardown-only'
        run: |
          UI=$(jq -r ".\"TemporalStack-$SUFFIX\".UiUrl" /tmp/outputs.json)
          echo "UI: $UI"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$UI" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "UI never returned 200 (last: $code)"; exit 1; }
          curl -sf --max-time 10 "$UI/api/v1/settings" >/dev/null
          curl -s --max-time 10 "$UI/api/v1/namespaces?pageSize=10" | grep -q '"namespaces"'
          echo "VALIDATED: UI 200, settings API 200, namespaces listed (frontend + Aurora live)"


      - name: Validate — execute a real workflow on the deployed cluster
        if: inputs.mode != 'teardown-only'
        run: |
          OUT() { jq -r ".\"TemporalStack-$SUFFIX\".$1" /tmp/outputs.json; }
          CLUSTER=$(OUT E2eClusterName)
          TASKDEF=$(OUT E2eStarterTaskDef)
          SG=$(OUT E2eStarterSecurityGroup)
          SUBNETS=$(OUT E2ePrivateSubnets)
          LOGGROUP=$(OUT E2eStarterLogGroup)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE \
            --task-definition "$TASKDEF" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "starter task: $TASK"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "--- starter output:"
          STREAM=$(aws logs describe-log-streams --log-group-name "$LOGGROUP" \
            --order-by LastEventTime --descending --max-items 1 \
            --query 'logStreams[0].logStreamName' --output text)
          aws logs get-log-events --log-group-name "$LOGGROUP" --log-stream-name "$STREAM" \
            --query 'events[].message' --output text || true
          [ "$EXIT" = "0" ] || { echo "starter exited $EXIT"; exit 1; }
          echo "VALIDATED: workflow executed end-to-end on AWS (starter exit 0 — worker fleet processed it)"

      - name: Validate — worker heartbeats via the frontend HTTP API (in-VPC)
        if: inputs.mode != 'teardown-only'
        run: |
          # ListWorkers lives on the FRONTEND HTTP API (:7243, internal
          # NLB) — the UI server does not proxy it ("method ListWorkers
          # not supported"), so the probe must run inside the VPC.
          OUT() { jq -r ".\"TemporalStack-$SUFFIX\".$1" /tmp/outputs.json; }
          TASK=$(aws ecs run-task --cluster "$(OUT E2eClusterName)" --launch-type FARGATE \
            --task-definition "$(OUT E2eStarterTaskDef)" \
            --network-configuration "awsvpcConfiguration={subnets=[$(OUT E2ePrivateSubnets)],securityGroups=[$(OUT E2eStarterSecurityGroup)],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"starter","command":["python","heartbeat_probe.py"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$(OUT E2eClusterName)" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$(OUT E2eClusterName)" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT" != "0" ]; then
            echo "heartbeat probe exited $EXIT — dumping evidence (teardown erases it):"
            echo "===== probe output:"
            aws logs tail "/ecs/TemporalStack-$SUFFIX/e2e-starter" --since 30m 2>/dev/null | tail -20
            echo "===== worker fleet:"
            aws logs tail "/ecs/TemporalStack-$SUFFIX/E2eWorker" --since 30m 2>/dev/null | tail -15
            echo "===== server dynamic-config lines:"
            aws logs tail "/ecs/TemporalStack-$SUFFIX/temporal-server" --since 60m 2>/dev/null \
              | grep -iE "dynamic|heartbeat" | tail -15
            exit 1
          fi
          echo "VALIDATED: worker heartbeats enabled (frontend ListWorkers returns live workers)"

      - name: Validate — backlog autoscaling scales the fleet out
        if: inputs.mode != 'teardown-only'
        run: |
          OUT() { jq -r ".\"TemporalStack-$SUFFIX\".$1" /tmp/outputs.json; }
          CLUSTER=$(OUT E2eClusterName)
          TASKDEF=$(OUT E2eStarterTaskDef)
          SG=$(OUT E2eStarterSecurityGroup)
          SUBNETS=$(OUT E2ePrivateSubnets)
          SERVICE="TemporalStack-$SUFFIX-E2eWorker"
          # 150 workflows x 3s activities against a 4-slot worker: backlog
          # forms, the poller publishes it, step scaling adds tasks.
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE \
            --task-definition "$TASKDEF" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"starter","environment":[{"name":"STARTER_ITERATIONS","value":"150"}]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "burst starter task: $TASK"
          SCALED=0
          for i in $(seq 1 24); do
            DESIRED=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].desiredCount' --output text)
            RUNNING=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].runningCount' --output text)
            echo "t+$((i*30))s: desired=$DESIRED running=$RUNNING"
            [ "$DESIRED" -gt 1 ] && { SCALED=1; break; }
            sleep 30
          done
          [ "$SCALED" = "1" ] || { echo "fleet never scaled out"; exit 1; }
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK" || true
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$EXIT" = "0" ] || { echo "burst starter exited $EXIT"; exit 1; }
          PEAK=$(aws cloudwatch get-metric-statistics --namespace Temporal/TaskQueue \
            --metric-name ApproximateBacklogCount \
            --dimensions Name=TaskQueue,Value=greeting-tasks-python Name=TemporalNamespace,Value=default \
            --start-time "$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --period 60 --statistics Maximum \
            --query 'max_by(Datapoints, &Maximum).Maximum' --output text)
          echo "peak published backlog: $PEAK"
          echo "VALIDATED: backlog metrics published + fleet scaled out under load + all 150 workflows completed"

      - name: Report kept stack (deploy-keep)
        if: inputs.mode == 'deploy-keep'
        run: |
          echo "STACK LEFT RUNNING for inspection — tear down with mode=teardown-only."
          jq -r ".\"TemporalStack-$SUFFIX\" | \"UI:   \(.UiUrl)\ngRPC: \(.GrpcEndpoint)\"" /tmp/outputs.json

      - name: Teardown — this run's Temporal infra ONLY
        if: always() && inputs.mode != 'deploy-keep'
        run: |
          npx cdk destroy --all --force \
            -c stackSuffix="$SUFFIX" \
            -c "@aws-cdk/core:bootstrapQualifier=$QUALIFIER" \
            --toolkit-stack-name "$TOOLKIT_STACK" || true
          # Remove the isolated bootstrap stack + its qualified assets
          aws cloudformation delete-stack --stack-name "$TOOLKIT_STACK" || true
          aws cloudformation wait stack-delete-complete --stack-name "$TOOLKIT_STACK" || true
          # Bootstrap buckets are VERSIONED: purge versions + delete markers
          # before rb (plain `s3 rb --force` cannot remove them).
          B="cdk-$QUALIFIER-assets-$ACCOUNT-us-east-1"
          for q in "Versions" "DeleteMarkers"; do
            aws s3api list-object-versions --bucket "$B" --output json \
              --query "{Objects: ${q}[].{Key:Key,VersionId:VersionId}}" > /tmp/purge.json 2>/dev/null || continue
            if [ "$(jq '.Objects | length' /tmp/purge.json 2>/dev/null)" != "0" ] && [ "$(jq '.Objects' /tmp/purge.json)" != "null" ]; then
              aws s3api delete-objects --bucket "$B" --delete file:///tmp/purge.json > /dev/null || true
            fi
          done
          aws s3 rb "s3://$B" || true
          aws ecr delete-repository --repository-name "cdk-$QUALIFIER-container-assets-$ACCOUNT-us-east-1" --force || true
          aws ecr delete-repository --repository-name "$E2E_REPO" --force || true
          # Fixed-name log groups: purge leftovers from any partial delete,
          # else the NEXT run's deploy fails with AlreadyExists. Includes
          # the RETAIN groups CDK's Lambdas create at runtime (poller).
          for prefix in "/ecs/TemporalStack-$SUFFIX" "/aws/lambda/TemporalStack-$SUFFIX"; do
            for lg in $(aws logs describe-log-groups --log-group-name-prefix "$prefix" \
                --query 'logGroups[].logGroupName' --output text); do
              aws logs delete-log-group --log-group-name "$lg" || true
            done
          done

      - name: Post-teardown audit — nothing of ours remains
        if: always() && inputs.mode != 'deploy-keep'
        run: |
          leftovers=0
          for s in "TemporalNetworkStack-$SUFFIX" "TemporalStack-$SUFFIX" "$TOOLKIT_STACK"; do
            if aws cloudformation describe-stacks --stack-name "$s" >/dev/null 2>&1; then
              status=$(aws cloudformation describe-stacks --stack-name "$s" --query 'Stacks[0].StackStatus' --output text)
              echo "STILL PRESENT: $s ($status)"; leftovers=1
            fi
          done
          remaining=$(aws logs describe-log-groups --log-group-name-prefix "/ecs/TemporalStack-$SUFFIX" \
            --query 'logGroups[].logGroupName' --output text)
          if [ -n "$remaining" ]; then echo "STILL PRESENT: log groups: $remaining"; leftovers=1; fi
          [ "$leftovers" = "0" ] && echo "AUDIT OK: all created stacks and log groups are gone"
          exit $leftovers

      # Runs AFTER the audit: the audit's describe-stacks needs this grant —
      # revoking it first would make "gone" indistinguishable from "denied".
      # deploy-keep retains the grant: the later teardown-only run needs it
      # (and re-puts it anyway — put-user-policy is idempotent).
      - name: Revoke run-scoped IAM grant
        if: always() && inputs.mode != 'deploy-keep'
        run: |
          ARN="arn:aws:iam::$ACCOUNT:policy/temporal-testing-ephemeral-cfn"
          aws iam detach-user-policy --user-name cicd_user --policy-arn "$ARN" || true
          aws iam delete-policy --policy-arn "$ARN" || true
          echo "remaining policies on cicd_user (inline + attached):"
          aws iam list-user-policies --user-name cicd_user --output text
          aws iam list-attached-user-policies --user-name cicd_user --output text
