name: aws-deploy-validate

# Real-AWS validation cycle: deploy NET-NEW Temporal infra, validate it
# serves, then tear down ONLY what this run created. Manual dispatch only.
#
# Net-new guarantees:
#   - stack names carry the -ci suffix (never collide with existing stacks;
#     preflight aborts if they somehow exist)
#   - a dedicated CDK bootstrap qualifier + toolkit stack name, so any
#     pre-existing CDKToolkit in the account is never read or modified
#   - create-everything mode: no -c imports, so no lookups of existing infra
# Teardown runs even on failure so no billable resources are orphaned.
on:
  workflow_dispatch:

concurrency:
  group: aws-deploy-validate
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  QUALIFIER: tmprl01
  TOOLKIT_STACK: CDKToolkit-temporal-testing
  SUFFIX: ci

jobs:
  deploy-validate-teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci

      - name: Preflight — identity + net-new guarantee
        run: |
          aws sts get-caller-identity
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          for s in "TemporalNetworkStack-$SUFFIX" "TemporalStack-$SUFFIX" "$TOOLKIT_STACK"; do
            if aws cloudformation describe-stacks --stack-name "$s" >/dev/null 2>&1; then
              echo "ABORT: stack $s already exists — refusing to touch it." >&2
              exit 1
            fi
          done
          echo "preflight OK: all target stacks are net-new"

      - name: Bootstrap (isolated qualifier + toolkit)
        run: |
          npx cdk bootstrap "aws://$ACCOUNT/us-east-1" \
            --qualifier "$QUALIFIER" \
            --toolkit-stack-name "$TOOLKIT_STACK"

      - name: Deploy (create-everything, suffixed)
        run: |
          npx cdk deploy --all --require-approval never \
            -c stackSuffix="$SUFFIX" \
            -c "@aws-cdk/core:bootstrapQualifier=$QUALIFIER" \
            --toolkit-stack-name "$TOOLKIT_STACK" \
            --outputs-file /tmp/outputs.json
          cat /tmp/outputs.json

      - name: Validate — UI serves through ALB -> frontend -> Aurora
        run: |
          UI=$(jq -r ".\"TemporalStack-$SUFFIX\".UiUrl" /tmp/outputs.json)
          echo "UI: $UI"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$UI" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "UI never returned 200 (last: $code)"; exit 1; }
          curl -sf --max-time 10 "$UI/api/v1/settings" >/dev/null
          curl -s --max-time 10 "$UI/api/v1/namespaces?pageSize=10" | grep -q '"namespaces"'
          echo "VALIDATED: UI 200, settings API 200, namespaces listed (frontend + Aurora live)"

      - name: Teardown — this run's Temporal infra ONLY
        if: always()
        run: |
          npx cdk destroy --all --force \
            -c stackSuffix="$SUFFIX" \
            -c "@aws-cdk/core:bootstrapQualifier=$QUALIFIER" \
            --toolkit-stack-name "$TOOLKIT_STACK" || true
          # Remove the isolated bootstrap stack + its qualified assets
          aws cloudformation delete-stack --stack-name "$TOOLKIT_STACK" || true
          aws cloudformation wait stack-delete-complete --stack-name "$TOOLKIT_STACK" || true
          aws s3 rb "s3://cdk-$QUALIFIER-assets-$ACCOUNT-us-east-1" --force || true
          aws ecr delete-repository --repository-name "cdk-$QUALIFIER-container-assets-$ACCOUNT-us-east-1" --force || true

      - name: Post-teardown audit — nothing of ours remains
        if: always()
        run: |
          leftovers=0
          for s in "TemporalNetworkStack-$SUFFIX" "TemporalStack-$SUFFIX" "$TOOLKIT_STACK"; do
            if aws cloudformation describe-stacks --stack-name "$s" >/dev/null 2>&1; then
              status=$(aws cloudformation describe-stacks --stack-name "$s" --query 'Stacks[0].StackStatus' --output text)
              echo "STILL PRESENT: $s ($status)"; leftovers=1
            fi
          done
          [ "$leftovers" = "0" ] && echo "AUDIT OK: all created stacks are gone"
          exit $leftovers
